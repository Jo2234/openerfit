# Manual release configuration and verification: docs/deploy-render.md.
# This template still defaults to LLM_MODE=none (labelled scripted/template output).
# Real-model release overrides: Groq qwen/qwen3.8-27b, reasoning none, seed off,
# timeout 45000 ms and planner/writer/baseline caps 512/512/768; see README.
# Local production verified 3 Nov 2026; hosted results are recorded per GitHub release. Supply keys privately.
services:
  - type: web
    name: openerfit
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: QLOO_MODE
        value: live
      - key: QLOO_API_KEY
        sync: false
      # Template writing works without an LLM; opt in using the variables below.
      - key: LLM_MODE
        value: none
      # For openai-compatible mode, supply the provider's base URL and model.
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_SUPPORTS_SEED
        sync: false
      - key: LLM_REASONING_EFFORT
        sync: false
      - key: LLM_PLANNER_MAX_TOKENS
        sync: false
      - key: LLM_WRITER_MAX_TOKENS
        sync: false
      - key: LLM_BASELINE_MAX_TOKENS
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: QLOO_CACHE_DIR
        value: /tmp/qloo-cache
